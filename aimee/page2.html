<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aimee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            max-width: 400px;
        }

        .image-container {
            width: 300px;
            height: 300px;
            margin: 0 auto 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .love-message {
            font-size: 22px;
            color: #c62828;
            font-style: italic;
        }

        /* Hearts Animation */
        .heart {
            position: fixed;
            font-size: 24px;
            animation: floatHeart 4s ease-in-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes floatHeart {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(0.5) rotate(45deg);
            }
        }

        /* Responsive */
        @media (max-width: 400px) {
            .card {
                padding: 20px;
                margin: 20px;
            }

            .image-container {
                width: 250px;
                height: 250px;
            }

            .love-message {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="image-container">
                <img src="wedding-together.jpg" alt="Us">
            </div>
            <div class="love-message">I love you!</div>
        </div>
    </div>

    <script>
        // Continue hearts animation from transition
        function createHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💘'];

            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '-50px';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 5000);
                }, i * 150);
            }
        }

        // Start hearts on page load
        createHearts();
    </script>
</body>
</html>
